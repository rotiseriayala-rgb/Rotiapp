<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RotiApp · Rotisería Yala</title>
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="touchIcon">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Colores sacados del logo de Rotisería Yala ===== */
:root{
  --verde:#0E4D2C;      /* verde oscuro de las letras */
  --verde-2:#16623A;
  --oliva:#6B8E3A;      /* verde del pañuelo y el gorro */
  --oliva-claro:#DCE7C8;
  --crema:#FBF8EC;      /* fondo del logo */
  --papel:#FFFFFF;
  --piel:#F6C48E;       /* cara del cocinero */
  --dorado:#E8A33D;     /* estrella del más vendido */
  --rojo:#C8442F;       /* sold out */
  --texto:#1D2A22;
  --gris:#6F786F;
  --borde:#E6E1CF;
  --sombra:0 2px 10px rgba(14,77,44,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--crema);color:var(--texto);
  display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
.app{width:100%;max-width:480px;min-height:100%;position:relative;background:var(--crema);
  display:flex;flex-direction:column;padding-bottom:110px}

/* ===== Barra de arriba ===== */
header{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  box-shadow:0 2px 12px rgba(0,0,0,.18)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.12)}
.marca{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo-wrap{position:relative;display:block;flex:none}
.nube{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#5BD47A;border:2px solid var(--verde)}
.nube.off{background:#E8A33D}
.marca img{width:40px;height:40px;border-radius:50%;background:var(--crema);border:2px solid var(--oliva-claro)}
.marca .nombre{font-family:'Fredoka',sans-serif;font-weight:700;font-size:23px;letter-spacing:.3px;line-height:1}
.marca .sub{font-size:11px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase}
.btn-sesion{border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;
  white-space:nowrap;display:flex;align-items:center;gap:6px}
.btn-sesion .avatar{width:22px;height:22px;border-radius:50%;background:var(--piel);color:var(--verde);display:grid;place-items:center;font-size:12px;font-weight:700}

/* ===== Resumen rápido ===== */
.resumen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 14px 4px}
.chip{background:var(--papel);border-radius:14px;padding:10px 10px;box-shadow:var(--sombra)}
.chip .lbl{font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.6px}
.chip .val{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;color:var(--verde);margin-top:2px;white-space:nowrap}

h2.titulo{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:var(--verde);margin:16px 16px 4px;display:flex;align-items:center;gap:8px}
p.ayuda{margin:0 16px 10px;color:var(--gris);font-size:13px}

/* ===== Grilla de platos ===== */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:6px 14px}
.plato{background:var(--papel);border-radius:18px;box-shadow:var(--sombra);overflow:hidden;position:relative;
  display:flex;flex-direction:column;transition:transform .12s}
.plato.agotado{opacity:.6}
.plato .foto{aspect-ratio:4/3;background:var(--oliva-claro);display:grid;place-items:center;font-size:46px;position:relative;cursor:pointer}
.plato .foto img{width:100%;height:100%;object-fit:cover}
.estrella{position:absolute;top:6px;right:6px;background:var(--dorado);color:#fff;border-radius:999px;font-size:11px;font-weight:700;
  padding:3px 8px 3px 6px;display:flex;align-items:center;gap:3px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sello-agotado{position:absolute;inset:auto 0 8px 0;margin:auto;width:max-content;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:6px;transform:rotate(-4deg);letter-spacing:1px}
.contador{position:absolute;top:6px;left:6px;background:rgba(14,77,44,.92);color:#fff;border-radius:999px;min-width:26px;height:26px;
  display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 7px}
.plato .info{padding:8px 10px 4px;display:flex;align-items:center;gap:8px}
.controles{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 10px 10px}
.controles .cant{flex:1;text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--verde);line-height:1}
.controles .cant small{display:block;font-family:'Poppins';font-weight:500;font-size:10px;color:var(--gris)}
.menos{width:44px;height:44px;border-radius:14px;background:#fff;color:var(--rojo);border:2px solid #EBC3BB;font-size:30px;line-height:1;display:grid;place-items:center;flex:none;transition:transform .08s}
.menos:active{transform:scale(.92)}
.menos:disabled{color:#C9CEC9;border-color:var(--borde)}
.plato .txt{flex:1;min-width:0}
.plato .nom{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plato .precio{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--oliva);font-size:16px}
.plato .stock{font-size:11px;color:var(--gris)}
.mas{width:44px;height:44px;border-radius:14px;background:var(--verde);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;flex:none;
  box-shadow:0 3px 0 #08341d;transition:transform .08s}
.mas:active{transform:translateY(3px);box-shadow:none}
.mas:disabled{background:#9AA59C;box-shadow:none}
.plato.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.04)}}
.flota.resta{color:var(--rojo)}
.flota{position:absolute;right:16px;bottom:56px;font-family:'Fredoka';font-weight:700;color:var(--oliva);font-size:18px;pointer-events:none;
  animation:sube .7s forwards}
@keyframes sube{to{transform:translateY(-40px);opacity:0}}

/* ===== Vacío ===== */
.vacio{margin:30px 20px;text-align:center;color:var(--gris)}
.vacio img{width:150px;border-radius:50%;opacity:.95}
.vacio b{display:block;color:var(--verde);font-size:17px;margin:10px 0 4px}

/* ===== Botón flotante ===== */
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));z-index:15;width:62px;height:62px;border-radius:20px;background:var(--oliva);color:#fff;
  font-size:34px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,77,44,.35)}
.fab-wrap{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:15}
.fab-wrap .inner{width:100%;max-width:480px;position:relative;height:0}
.fab-wrap .fab{pointer-events:auto;position:absolute;right:18px;bottom:max(20px,env(safe-area-inset-bottom))}

/* ===== Menú hamburguesa ===== */
.velo{position:fixed;inset:0;background:rgba(10,30,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
nav.cajon{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--crema);z-index:41;transform:translateX(-102%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.2)}
nav.cajon.on{transform:none}
.cajon-top{background:var(--verde);color:#fff;padding:18px 16px 16px;padding-top:max(18px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.cajon-top img{width:58px;height:58px;border-radius:50%;background:var(--crema)}
.cajon-top .n{font-family:'Fredoka';font-weight:700;font-size:22px}
.cajon-top .s{font-size:12px;opacity:.8}
.cajon-top .cerrar{margin-left:auto}
.cajon ul{list-style:none;margin:8px 0;padding:0}
.cajon li button{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:15.5px;font-weight:500;text-align:left;border-bottom:1px solid var(--borde)}
.cajon li button .ic{width:34px;height:34px;border-radius:10px;background:var(--oliva-claro);display:grid;place-items:center;font-size:18px}
.cajon li button.activo{background:#fff;color:var(--verde);font-weight:700}
.cajon li button.activo .ic{background:var(--verde);color:#fff}
.cajon .pie{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--gris)}
.cajon .pie button{color:var(--verde);font-weight:600;text-decoration:underline;font-size:12px;padding:4px 0;display:block}

/* ===== Tarjetas de estadísticas ===== */
.card{background:var(--papel);border-radius:18px;box-shadow:var(--sombra);margin:10px 14px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.grande{font-family:'Fredoka';font-weight:700;font-size:40px;color:var(--verde);line-height:1.05}
.grande small{font-size:15px;color:var(--gris);font-weight:500;font-family:'Poppins'}
.fila{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--borde);font-size:14px}
.fila:last-child{border-bottom:0}
.fila b{color:var(--verde)}
.pestanas{display:flex;gap:6px;margin:6px 14px 0;background:#EDE8D6;padding:4px;border-radius:12px}
.pestanas button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--gris)}
.pestanas button.on{background:#fff;color:var(--verde);box-shadow:var(--sombra)}

/* barras de ranking */
.rank{display:flex;align-items:center;gap:10px;padding:9px 0}
.rank .pos{width:28px;height:28px;border-radius:50%;background:var(--oliva-claro);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--verde);flex:none}
.rank:first-child .pos{background:var(--dorado);color:#fff}
.rank .cuerpo{flex:1;min-width:0}
.rank .linea{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.rank .linea span:last-child{color:var(--verde)}
.barra{height:9px;border-radius:9px;background:#EFEBDD;margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--oliva),var(--verde));border-radius:9px;transition:width .5s}
.rank .det{font-size:11.5px;color:var(--gris);margin-top:3px}

/* gráfico de columnas */
.columnas{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:18px}
.columnas .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.columnas .col i{width:100%;max-width:34px;background:var(--oliva);border-radius:7px 7px 3px 3px;min-height:3px;position:relative;transition:height .5s}
.columnas .col.hoy i{background:var(--verde)}
.columnas .col i em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--gris);white-space:nowrap}
.columnas .col span{font-size:11px;color:var(--gris)}
.columnas .col.hoy span{color:var(--verde);font-weight:700}

/* ===== Sold out ===== */
.boton-soldout{display:block;width:calc(100% - 28px);margin:14px;padding:22px;border-radius:22px;background:var(--rojo);color:#fff;
  font-family:'Fredoka';font-weight:700;font-size:28px;letter-spacing:1px;box-shadow:0 6px 0 #8f2d1e;transition:transform .08s}
.boton-soldout:active{transform:translateY(5px);box-shadow:0 1px 0 #8f2d1e}
.boton-soldout small{display:block;font-family:'Poppins';font-weight:500;font-size:13px;opacity:.9;letter-spacing:0}
.soldout-hecho{text-align:center}
.soldout-hecho .hora{font-family:'Fredoka';font-weight:700;font-size:56px;color:var(--rojo);line-height:1}
.link{color:var(--verde);font-weight:600;text-decoration:underline;font-size:13px;padding:6px}

/* ===== Ventanas (modales) ===== */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,30,20,.5)}
.modal.on{display:flex}
.hoja{background:var(--crema);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:entra .22s ease-out}
@keyframes entra{from{transform:translateY(40px);opacity:0}}
.hoja h3{font-family:'Fredoka';color:var(--verde);font-size:22px;margin:0 0 12px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-bottom:4px}
.campo input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--borde);background:#fff;font-size:16px}
.campo input:focus{outline:none;border-color:var(--oliva)}
.campo .nota{font-size:11.5px;color:var(--gris);margin-top:3px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid var(--borde);font-size:22px}
.emojis button.on{border-color:var(--verde);background:var(--oliva-claro)}
.foto-prev{width:64px;height:64px;border-radius:12px;object-fit:cover;display:none}
.acciones{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px}
.btn.prim{background:var(--verde);color:#fff}
.btn.sec{background:#fff;border:1.5px solid var(--borde);color:var(--texto)}
.btn.peligro{background:#fff;color:var(--rojo);border:1.5px solid #EBC3BB}
.ajuste{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px}
.ajuste button{width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--borde);font-size:22px;font-weight:700;color:var(--verde)}
.ajuste .n{font-family:'Fredoka';font-weight:700;font-size:30px;min-width:50px;text-align:center;color:var(--verde)}

/* ===== Aviso con deshacer ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#1D2A22;color:#fff;border-radius:14px;
  padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;
  width:max-content;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--oliva-claro);font-weight:700;padding:6px 10px;border-radius:8px}

/* candado */
.candado{position:fixed;inset:0;z-index:70;background:var(--verde);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.candado.on{display:flex}
.candado img{width:140px;border-radius:50%;background:var(--crema)}
.candado input{font-size:28px;letter-spacing:12px;text-align:center;width:200px;padding:10px;border-radius:14px;border:0}
.candado .err{color:#FFD2C8;min-height:20px;font-size:14px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="icon-btn" id="abrirMenu" aria-label="Abrir menú">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="marca">
      <span class="logo-wrap"><img data-logo alt="Logo Rotisería Yala"><i id="nubeEstado" class="nube off"></i></span>
      <div>
        <div class="nombre">RotiApp</div>
        <div class="sub">Rotisería Yala</div>
      </div>
    </div>
    <button class="btn-sesion" id="btnSesion"></button>
  </header>

  <main id="vista"></main>
</div>

<div class="fab-wrap" id="fabWrap"><div class="inner"><button class="fab" id="fab" aria-label="Agregar plato">+</button></div></div>

<!-- Menú hamburguesa -->
<div class="velo" id="velo"></div>
<nav class="cajon" id="cajon">
  <div class="cajon-top">
    <img data-logo alt="">
    <div><div class="n">RotiApp</div><div class="s" id="cajonSaludo">Rotisería Yala</div></div>
    <button class="icon-btn cerrar" id="cerrarMenu" aria-label="Cerrar menú">
      <svg width="24" height="24" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ul id="menuLista"></ul>
  <div class="pie">
    <button id="btnCierre">📲 Mandar resumen del día por WhatsApp</button>
    <button id="btnExportar">💾 Descargar copia de seguridad</button>
    <button id="btnImportar">📂 Recuperar copia de seguridad</button>
    <input type="file" id="archivoImport" accept=".json" hidden>
    <div style="margin-top:8px">Los datos se guardan en la nube: si cambiás de celular o actualizás la app, no se pierde nada.</div>
  </div>
</nav>

<!-- Ventana genérica -->
<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Deshacer</button></div>
<div class="candado" id="candado">
  <img data-logo alt="">
  <div style="font-family:Fredoka;font-size:26px;font-weight:700">RotiApp</div>
  <div>Ingresá tu PIN</div>
  <input type="password" inputmode="numeric" maxlength="6" id="pinIn">
  <div class="err" id="pinErr"></div>

<script>
/* =========================================================
   RotiApp · administración para Rotisería Yala
   Todo se guarda en el celular (localStorage), sin internet.
   ========================================================= */

const CLAVE = 'rotiapp-v1';          // copia local (para abrir rápido y sin señal)
const CLAVE_USUARIO = 'rotiapp-usuario'; // nombre y PIN: quedan sólo en este celular
const EMOJIS = ['🍗','🥩','🍝','🥟','🍕','🥗','🍔','🌯','🥘','🍲','🍟','🥧','🍰','🥤'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

/* ===== Base de datos en la nube (Firebase Realtime Database) =====
   Todo se guarda en el nodo "rotiapp":
     rotiapp/platos/{id}          → {id, nombre, precio, costo, emoji, foto}
     rotiapp/ventas/{id}          → {id, p, t, precio, costo}
     rotiapp/soldouts/{día}       → {dia, t}
     rotiapp/stockDia/{día}/{id}  → porciones preparadas */
const FIREBASE = { databaseURL: "https://rotiseriayala-597a3-default-rtdb.firebaseio.com" };
let nube = null;          // referencia a rotiapp/ en Firebase
let conectado = false;

// ---------- Datos ----------
let db = cargar();
function cargar(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(CLAVE)); }catch(e){}
  if(!d || !d.platos) d = {platos:[], ventas:[], soldouts:[], stockDia:{}};
  try{ d.usuario = JSON.parse(localStorage.getItem(CLAVE_USUARIO)) || d.usuario || null; }catch(e){ d.usuario = null; }
  return d;
}
// guarda la copia local (la nube se actualiza con subir/borrarNube)
function guardar(){
  try{
    const {usuario, ...resto} = db;
    localStorage.setItem(CLAVE, JSON.stringify(resto));
    localStorage.setItem(CLAVE_USUARIO, JSON.stringify(usuario||null));
  }catch(e){ /* sin lugar en el celular: igual queda en la nube */ }
}
const subir = (ruta, valor) => { if(nube) nube.child(ruta).set(valor ?? null).catch(errorNube); };
const borrarNube = ruta => subir(ruta, null);
function errorNube(e){
  console.error(e);
  avisar('⚠️ No se pudo guardar en la nube: revisá las reglas de Firebase');
}
// convierte lo que viene de Firebase al formato de la app
function desdeNube(v){
  v = v || {};
  return {
    usuario: db.usuario,
    platos: Object.values(v.platos||{}).sort((a,b)=>a.id<b.id?-1:1),
    ventas: Object.values(v.ventas||{}).sort((a,b)=>a.t-b.t),
    soldouts: Object.values(v.soldouts||{}),
    stockDia: v.stockDia||{},
  };
}
function conectarNube(){
  try{
    firebase.initializeApp(FIREBASE);
    const base = firebase.database();
    nube = base.ref('rotiapp');
    base.ref('.info/connected').on('value', s => { conectado = !!s.val(); pintarConexion(); });
    let primera = true;
    nube.on('value', snap => {
      const remoto = snap.val();
      // si la nube está vacía pero este celular ya tenía datos, los sube
      if(primera && !remoto && (db.platos.length || db.ventas.length)){
        primera = false; nube.set(paraNube(db)).catch(errorNube); return;
      }
      primera = false;
      db = desdeNube(remoto);
      // ventas de platos que ya no existen (quedaron de antes): se borran con su plata
      const huerfanas = db.ventas.filter(v=>!plato(v.p));
      if(huerfanas.length){
        const cambios = {}; huerfanas.forEach(v=>cambios['ventas/'+v.id]=null);
        nube.update(cambios).catch(errorNube);
        db.ventas = db.ventas.filter(v=>plato(v.p));
      }
      guardar();
      if(!$('#modal').classList.contains('on')) render();
    }, e => { console.error(e); avisar('⚠️ No se pudo leer la base de datos (reglas de Firebase)'); });
  }catch(e){ console.error(e); pintarConexion(); }
}
function paraNube(d){
  const o = {platos:{}, ventas:{}, soldouts:{}, stockDia:d.stockDia||{}};
  d.platos.forEach(p=>o.platos[p.id]=p);
  d.ventas.forEach(v=>o.ventas[v.id]=v);
  d.soldouts.forEach(s=>o.soldouts[s.dia]=s);
  return o;
}
function pintarConexion(){
  const el = $('#nubeEstado'); if(!el) return;
  el.classList.toggle('off', !conectado);
  el.title = conectado ? 'Conectado: todo se guarda en la nube' : 'Sin conexión: se guarda cuando vuelva internet';
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- Fechas ----------
const claveDia = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const inicioDia = (t=Date.now()) => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function inicioSemana(t=Date.now()){ // la semana arranca el lunes
  const d=new Date(inicioDia(t)); const dif=(d.getDay()+6)%7; d.setDate(d.getDate()-dif); return d.getTime();
}
function inicioMes(t=Date.now()){ const d=new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
const hora = t => new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
const plata = n => '$' + Math.round(n).toLocaleString('es-AR');

// ---------- Cálculos ----------
const ventasDesde = desde => db.ventas.filter(v => v.t >= desde);
function porPlato(ventas){
  const m = {};
  for(const v of ventas){
    m[v.p] ??= {cant:0, plata:0, ganancia:0};
    m[v.p].cant++; m[v.p].plata += v.precio; m[v.p].ganancia += v.precio - (v.costo||0);
  }
  return m;
}
function sumar(ventas){
  let plataT=0, gan=0;
  for(const v of ventas){ plataT += v.precio; gan += v.precio-(v.costo||0); }
  return {cant:ventas.length, plata:plataT, ganancia:gan};
}
const plato = id => db.platos.find(p=>p.id===id);
const nombrePlato = id => plato(id)?.nombre ?? 'Plato borrado';
function vendidosHoy(id){ const h=inicioDia(); return db.ventas.filter(v=>v.p===id && v.t>=h).length; }
function stockHoy(id){ return db.stockDia[claveDia()]?.[id]; } // undefined = sin límite
function quedan(id){ const s=stockHoy(id); return s==null ? null : Math.max(0, s - vendidosHoy(id)); }
function masVendidoHoy(){
  const m = porPlato(ventasDesde(inicioDia()));
  let mejor=null, max=0;
  for(const [id,d] of Object.entries(m)) if(d.cant>max && plato(id)){ max=d.cant; mejor=id; }
  return mejor;
}
const soldoutHoy = () => db.soldouts.find(s => s.dia === claveDia());

// ---------- Navegación ----------
const SECCIONES = [
  {id:'productos', ic:'🍽️', nom:'Productos'},
  {id:'favoritos', ic:'⭐', nom:'Favoritos'},
  {id:'ingresos',  ic:'💰', nom:'Ingresos'},
  {id:'hoy',       ic:'📋', nom:'Cantidad de hoy'},
  {id:'soldout',   ic:'⏰', nom:'Hora de sold out'},
];
let seccion = 'productos';
let periodoIngresos = 'hoy';

function irA(s){ seccion=s; cerrarMenu(); render(); window.scrollTo(0,0); }

function renderMenu(){
  $('#menuLista').innerHTML = SECCIONES.map(s =>
    `<li><button class="${s.id===seccion?'activo':''}" data-ir="${s.id}"><span class="ic">${s.ic}</span>${s.nom}</button></li>`).join('');
}

// ---------- Utilidades DOM ----------
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- Render principal ----------
function render(){
  renderMenu();
  renderSesion();
  $('#fabWrap').style.display = seccion==='productos' ? '' : 'none';
  const f = {productos:vProductos, favoritos:vFavoritos, ingresos:vIngresos, hoy:vHoy, soldout:vSoldout}[seccion];
  $('#vista').innerHTML = f();
}

function resumenHoy(){
  const r = sumar(ventasDesde(inicioDia()));
  const so = soldoutHoy();
  return `<div class="resumen">
    <div class="chip"><div class="lbl">Platos hoy</div><div class="val">${r.cant}</div></div>
    <div class="chip"><div class="lbl">Caja hoy</div><div class="val">${plata(r.plata)}</div></div>
    <div class="chip"><div class="lbl">Sold out</div><div class="val" style="${so?'color:var(--rojo)':''}">${so?hora(so.t):'—'}</div></div>
  </div>`;
}

// ===== 1. PRODUCTOS =====
function vProductos(){
  if(!db.platos.length){
    return `<div class="vacio">
      <img src="${LOGO}" alt="">
      <b>Todavía no hay platos cargados</b>
      Tocá el botón <b style="display:inline;color:var(--oliva)">+</b> de abajo para agregar el primero:<br>nombre, precio y una foto si querés.
    </div>`;
  }
  const top = masVendidoHoy();
  const tarjetas = db.platos.map(p=>{
    const n = vendidosHoy(p.id);
    const q = quedan(p.id);
    const agot = q===0;
    const foto = p.foto ? `<img src="${p.foto}" alt="">` : (p.emoji||'🍽️');
    return `<div class="plato ${agot?'agotado':''}" id="pl-${p.id}">
      <div class="foto" data-editar="${p.id}">
        ${foto}
        ${p.id===top?`<span class="estrella">★ Más vendido</span>`:''}
        ${agot?`<span class="sello-agotado">AGOTADO</span>`:''}
      </div>
      <div class="info">
        <div class="txt">
          <div class="nom">${esc(p.nombre)}</div>
          <div class="precio">${plata(p.precio)}</div>
          ${q!=null?`<div class="stock">Quedan ${q}</div>`:''}
        </div>
      </div>
      <div class="controles">
        <button class="menos" data-restar="${p.id}" ${n?'':'disabled'} aria-label="Restar una ${esc(p.nombre)}">−</button>
        <div class="cant">${n}<small>${n===1?'vendido':'vendidos'}</small></div>
        <button class="mas" data-vender="${p.id}" ${agot?'disabled':''} aria-label="Sumar una ${esc(p.nombre)}">+</button>
      </div>
    </div>`;
  }).join('');
  return resumenHoy() + `
    <h2 class="titulo">🍽️ Productos</h2>
    <p class="ayuda">Tocá <b>+</b> cada vez que vendés un plato y <b>−</b> si te equivocaste. Tocá la foto para editarlo.</p>
    <div class="grilla">${tarjetas}</div>`;
}

function vender(id){
  const p = plato(id); if(!p) return;
  if(quedan(id)===0) return;
  const v = {id:uid(), p:id, t:Date.now(), precio:p.precio, costo:p.costo||0};
  db.ventas.push(v); guardar(); subir('ventas/'+v.id, v);
  if(navigator.vibrate) navigator.vibrate(25);
  render();
  const card = document.getElementById('pl-'+id);
  if(card){
    card.classList.add('pop');
    const f=document.createElement('span'); f.className='flota'; f.textContent='+'+plata(p.precio); card.appendChild(f);
  }
  const q = quedan(id);
  avisar(q===0 ? `¡Se terminó ${p.nombre}!` : `+1 ${p.nombre}`, ()=>{
    db.ventas = db.ventas.filter(x=>x.id!==v.id); guardar(); borrarNube('ventas/'+v.id); render();
  });
}

// resta la última venta de hoy de ese plato: se va la unidad y también su plata
function restar(id){
  const p = plato(id); if(!p) return;
  const hoy = inicioDia();
  const ult = [...db.ventas].reverse().find(v=>v.p===id && v.t>=hoy);
  if(!ult) return;
  db.ventas = db.ventas.filter(v=>v.id!==ult.id); guardar(); borrarNube('ventas/'+ult.id);
  if(navigator.vibrate) navigator.vibrate(15);
  render();
  const card = document.getElementById('pl-'+id);
  if(card){ const f=document.createElement('span'); f.className='flota resta'; f.textContent='−'+plata(ult.precio); card.appendChild(f); }
  avisar(`−1 ${p.nombre} (−${plata(ult.precio)})`, ()=>{
    db.ventas.push(ult); db.ventas.sort((a,b)=>a.t-b.t); guardar(); subir('ventas/'+ult.id, ult); render();
  });
}

// ===== 2. FAVORITOS =====
function vFavoritos(){
  const sem = porPlato(ventasDesde(inicioSemana()));
  const lista = Object.entries(sem).sort((a,b)=>b[1].cant-a[1].cant);
  const max = lista[0]?.[1].cant || 1;
  const desde = new Date(inicioSemana()).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'});
  let cuerpo;
  if(!lista.length) cuerpo = `<div class="vacio" style="margin:10px"><b>Sin ventas esta semana</b>Cuando empieces a vender aparece el ranking acá.</div>`;
  else cuerpo = lista.map(([id,d],i)=>`
    <div class="rank">
      <div class="pos">${i+1}</div>
      <div class="cuerpo">
        <div class="linea"><span>${plato(id)?.emoji||'🍽️'} ${esc(nombrePlato(id))}</span><span>${d.cant} u.</span></div>
        <div class="barra"><i style="width:${d.cant/max*100}%"></i></div>
        <div class="det">${plata(d.plata)} vendidos</div>
      </div>
    </div>`).join('');

  // día de la semana que más se vende (todas las semanas)
  const porDia=[0,0,0,0,0,0,0];
  for(const v of db.ventas) porDia[new Date(v.t).getDay()]++;
  const mejorDia = porDia.some(x=>x) ? porDia.indexOf(Math.max(...porDia)) : -1;
  const nombresLargos=['domingos','lunes','martes','miércoles','jueves','viernes','sábados'];

  return `<h2 class="titulo">⭐ Favoritos de la semana</h2>
    <p class="ayuda">Desde el ${desde}.</p>
    <div class="card">${cuerpo}</div>
    ${mejorDia>=0?`<div class="card"><h3>Dato</h3>Los <b style="color:var(--verde)">${nombresLargos[mejorDia]}</b> son los días que más platos vendés (${porDia[mejorDia]} en total).</div>`:''}`;
}

// ===== 3. INGRESOS =====
function vIngresos(){
  const desde = {hoy:inicioDia(), semana:inicioSemana(), mes:inicioMes()}[periodoIngresos];
  const vs = ventasDesde(desde);
  const r = sumar(vs);
  const hayCostos = db.platos.some(p=>p.costo>0);
  const pp = Object.entries(porPlato(vs)).sort((a,b)=>b[1].plata-a[1].plata);

  // últimos 7 días
  const dias=[];
  for(let i=6;i>=0;i--){
    const d=new Date(inicioDia()); d.setDate(d.getDate()-i);
    const ini=d.getTime(), fin=ini+86400000;
    const s=db.ventas.filter(v=>v.t>=ini&&v.t<fin).reduce((a,v)=>a+v.precio,0);
    dias.push({lbl:DIAS[d.getDay()], s, hoy:i===0});
  }
  const maxD = Math.max(...dias.map(d=>d.s),1);
  const corto = n => n>=1000 ? '$'+(n/1000).toFixed(n>=10000?0:1)+'k' : '$'+n;

  return `<h2 class="titulo">💰 Ingresos</h2>
    <div class="pestanas">
      ${['hoy','semana','mes'].map(k=>`<button class="${k===periodoIngresos?'on':''}" data-periodo="${k}">${k==='hoy'?'Hoy':k==='semana'?'Semana':'Mes'}</button>`).join('')}
    </div>
    <div class="card">
      <h3>Entró a la caja</h3>
      <div class="grande">${plata(r.plata)}</div>
      <div style="color:var(--gris);font-size:13px;margin-top:4px">${r.cant} platos · ticket promedio ${plata(r.cant?r.plata/r.cant:0)}</div>
      ${hayCostos?`<div class="fila" style="margin-top:10px"><span>Ganancia (precio − costo)</span><b>${plata(r.ganancia)}</b></div>`
        :`<div style="font-size:12px;color:var(--gris);margin-top:10px">💡 Si cargás el <b>costo</b> de cada plato, acá te muestra la ganancia real.</div>`}
    </div>
    <div class="card">
      <h3>Últimos 7 días</h3>
      <div class="columnas">${dias.map(d=>`<div class="col ${d.hoy?'hoy':''}"><i style="height:${d.s/maxD*100}%">${d.s?`<em>${corto(d.s)}</em>`:''}</i><span>${d.lbl}</span></div>`).join('')}</div>
    </div>
    ${pp.length?`<div class="card"><h3>Por plato</h3>${pp.map(([id,d])=>`<div class="fila"><span>${esc(nombrePlato(id))} <span style="color:var(--gris)">×${d.cant}</span></span><b>${plata(d.plata)}</b></div>`).join('')}</div>`:''}`;
}

// ===== 4. CANTIDAD DE HOY =====
function vHoy(){
  const vs = ventasDesde(inicioDia());
  const pp = porPlato(vs);
  const filas = db.platos.map(p=>{
    const n=pp[p.id]?.cant||0, s=stockHoy(p.id);
    return `<div class="fila">
      <span>${p.emoji||'🍽️'} ${esc(p.nombre)}</span>
      <span style="display:flex;align-items:center;gap:10px">
        <b>${n}${s!=null?` / ${s}`:''}</b>
        <button class="link" data-stock="${p.id}">${s!=null?'Editar':'Preparé…'}</button>
      </span></div>`;
  }).join('');

  // ventas por hora
  const hs={};
  for(const v of vs){ const h=new Date(v.t).getHours(); hs[h]=(hs[h]||0)+1; }
  const horas=Object.keys(hs).map(Number).sort((a,b)=>a-b);
  let graf='';
  if(horas.length){
    const ini=horas[0], fin=horas[horas.length-1], mx=Math.max(...Object.values(hs));
    const cols=[]; for(let h=ini;h<=fin;h++) cols.push(`<div class="col"><i style="height:${(hs[h]||0)/mx*100}%">${hs[h]?`<em>${hs[h]}</em>`:''}</i><span>${h}h</span></div>`);
    const pico=horas.reduce((a,h)=>hs[h]>hs[a]?h:a,horas[0]);
    graf=`<div class="card"><h3>¿A qué hora se vende más?</h3><div class="columnas">${cols.join('')}</div>
      <div style="font-size:13px;color:var(--gris);margin-top:8px">Hora pico: <b style="color:var(--verde)">${pico}:00 a ${pico+1}:00</b></div></div>`;
  }
  const hoyTxt = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  return `<h2 class="titulo">📋 Cantidad de hoy</h2>
    <p class="ayuda" style="text-transform:capitalize">${hoyTxt}</p>
    <div class="card"><h3>Menús vendidos</h3><div class="grande">${vs.length} <small>platos</small></div></div>
    <div class="card"><h3>Detalle por plato</h3>
      ${db.platos.length?filas:'<div style="color:var(--gris)">No hay platos cargados.</div>'}
      ${db.platos.length?`<div style="font-size:12px;color:var(--gris);margin-top:8px">💡 Con <b>“Preparé…”</b> anotás cuántas porciones hiciste y la app te avisa cuando se agota.</div>`:''}
    </div>${graf}`;
}

// ===== 5. HORA DE SOLD OUT =====
function vSoldout(){
  const so = soldoutHoy();
  const historial = [...db.soldouts].sort((a,b)=>b.t-a.t).slice(0,14);
  // promedio de hora de sold out
  let prom='';
  if(db.soldouts.length>=2){
    const mins = db.soldouts.map(s=>{const d=new Date(s.t);return d.getHours()*60+d.getMinutes();});
    const m = Math.round(mins.reduce((a,b)=>a+b,0)/mins.length);
    prom = `<div class="card"><h3>En promedio</h3>Te quedás sin comida a las <b style="color:var(--verde);font-size:18px">${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</b>.
      ${m<13*60?'<div style="font-size:12.5px;color:var(--gris);margin-top:6px">💡 Se agota temprano: quizás convenga preparar un poco más.</div>':''}</div>`;
  }
  const inicioDelDia = db.ventas.filter(v=>v.t>=inicioDia()).sort((a,b)=>a.t-b.t)[0];
  return `<h2 class="titulo">⏰ Hora de sold out</h2>
    ${so ? `<div class="card soldout-hecho">
        <h3>Hoy se terminó todo a las</h3>
        <div class="hora">${hora(so.t)}</div>
        ${inicioDelDia?`<div style="color:var(--gris);font-size:13px;margin-top:6px">Primera venta ${hora(inicioDelDia.t)} · ${duracion(so.t-inicioDelDia.t)} vendiendo</div>`:''}
        <button class="link" id="deshacerSO" style="margin-top:8px">Me equivoqué, borrar</button>
      </div>`
      : `<p class="ayuda">Cuando se terminen todos los menús, tocá el botón. La app guarda la hora sola.</p>
         <button class="boton-soldout" id="btnSoldout">SOLD OUT<small>Se terminó todo · ${hora(Date.now())}</small></button>`}
    ${prom}
    <div class="card"><h3>Días anteriores</h3>
      ${historial.length?historial.map(s=>`<div class="fila"><span style="text-transform:capitalize">${new Date(s.t).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'})}</span><b>${hora(s.t)}</b></div>`).join('')
        :'<div style="color:var(--gris);font-size:14px">Todavía no hay registros.</div>'}
    </div>`;
}
function duracion(ms){ const m=Math.round(ms/60000); return m<60? m+' min' : Math.floor(m/60)+' h '+(m%60?m%60+' min':''); }
function marcarSoldout(){
  if(soldoutHoy()) return;
  const so={dia:claveDia(), t:Date.now()};
  db.soldouts.push(so); guardar(); subir('soldouts/'+so.dia, so);
  if(navigator.vibrate) navigator.vibrate([60,40,60]);
  render();
}

// ---------- Ventana: agregar / editar plato ----------
let fotoTemp=null, emojiTemp='🍗';
function abrirPlato(id){
  const p = id ? plato(id) : null;
  fotoTemp = p?.foto || null; emojiTemp = p?.emoji || '🍗';
  $('#hoja').innerHTML = `
    <h3>${p?'Editar plato':'Nuevo plato'}</h3>
    <div class="campo"><label>Nombre del plato</label><input id="fNom" maxlength="30" placeholder="Ej: Milanesa con puré" value="${p?esc(p.nombre):''}"></div>
    <div class="dos">
      <div class="campo"><label>Precio de venta</label><input id="fPre" type="number" inputmode="numeric" min="0" placeholder="9000" value="${p?p.precio:''}"></div>
      <div class="campo"><label>Costo (opcional)</label><input id="fCos" type="number" inputmode="numeric" min="0" placeholder="4500" value="${p?.costo||''}">
        <div class="nota">Lo que te sale hacerlo</div></div>
    </div>
    <div class="campo"><label>Dibujito</label><div class="emojis">${EMOJIS.map(e=>`<button data-emoji="${e}" class="${e===emojiTemp?'on':''}">${e}</button>`).join('')}</div></div>
    <div class="campo"><label>…o una foto del plato</label>
      <div style="display:flex;align-items:center;gap:10px">
        <img class="foto-prev" id="fPrev" ${fotoTemp?`src="${fotoTemp}" style="display:block"`:''}>
        <button class="btn sec" style="flex:none;padding:10px 14px" id="fFotoBtn">📷 ${fotoTemp?'Cambiar':'Elegir'} foto</button>
        ${fotoTemp?'<button class="link" id="fFotoQuitar">Quitar</button>':''}
      </div>
      <input type="file" accept="image/*" id="fFoto" hidden>
    </div>
    <div class="acciones">
      ${p?`<button class="btn peligro" id="fBorrar">Borrar</button>`:`<button class="btn sec" data-cerrar>Cancelar</button>`}
      <button class="btn prim" id="fGuardar">Guardar</button>
    </div>
`;
  abrirModal();
  if(!p) setTimeout(()=>$('#fNom').focus(),250);

  $('#fFotoBtn').onclick = ()=>$('#fFoto').click();
  $('#fFoto').onchange = e => achicarFoto(e.target.files[0], url=>{ fotoTemp=url; const im=$('#fPrev'); im.src=url; im.style.display='block'; });
  if($('#fFotoQuitar')) $('#fFotoQuitar').onclick=()=>{ fotoTemp=null; $('#fPrev').style.display='none'; };
  $('#fGuardar').onclick = ()=>{
    const nombre=$('#fNom').value.trim(), precio=+$('#fPre').value, costo=+$('#fCos').value||0;
    if(!nombre){ $('#fNom').focus(); return; }
    if(!(precio>0)){ $('#fPre').focus(); return; }
    let pl = p;
    if(pl) Object.assign(pl,{nombre,precio,costo,emoji:emojiTemp,foto:fotoTemp});
    else { pl = {id:uid(),nombre,precio,costo,emoji:emojiTemp,foto:fotoTemp}; db.platos.push(pl); }
    guardar(); subir('platos/'+pl.id, pl); cerrarModal(); render();
  };
  if(p){
    $('#fBorrar').onclick=()=>{
      const suyas = db.ventas.filter(v=>v.p===p.id);
      const total = suyas.reduce((a,v)=>a+v.precio,0);
      const msj = suyas.length
        ? `¿Borrar "${p.nombre}"?

También se borran sus ${suyas.length} ventas (${plata(total)}) de los ingresos.`
        : `¿Borrar "${p.nombre}"?`;
      if(!confirm(msj)) return;
      db.platos = db.platos.filter(x=>x.id!==p.id);
      db.ventas = db.ventas.filter(v=>v.p!==p.id);
      guardar();
      if(nube){
        // un solo envío a Firebase con el plato y todas sus ventas
        const cambios = {['platos/'+p.id]: null};
        suyas.forEach(v=>cambios['ventas/'+v.id]=null);
        nube.update(cambios).catch(errorNube);
      }
      cerrarModal(); render();
    };
  }
}
// achica la foto para que no ocupe mucho lugar en el celular
function achicarFoto(file, cb){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=360, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.72));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

// ---------- Ventana: porciones preparadas ----------
function abrirStock(id){
  const p=plato(id); let n = stockHoy(id) ?? Math.max(vendidosHoy(id),10);
  $('#hoja').innerHTML=`
    <h3>${p.emoji||''} ${esc(p.nombre)}</h3>
    <p style="margin:0 0 10px;color:var(--gris);font-size:14px">¿Cuántas porciones preparaste hoy?</p>
    <div class="ajuste"><button id="sMenos5">−5</button><button id="sMenos">−</button><div class="n" id="sN">${n}</div><button id="sMas">+</button><button id="sMas5">+5</button></div>
    <div class="acciones">
      <button class="btn sec" id="sSin">Sin límite</button>
      <button class="btn prim" id="sOk">Guardar</button>
    </div>`;
  abrirModal();
  const pinta=()=>$('#sN').textContent=n;
  $('#sMenos').onclick=()=>{n=Math.max(0,n-1);pinta()};
  $('#sMenos5').onclick=()=>{n=Math.max(0,n-5);pinta()};
  $('#sMas').onclick=()=>{n++;pinta()};
  $('#sMas5').onclick=()=>{n+=5;pinta()};
  const set=v=>{ const k=claveDia(); db.stockDia[k]??={}; if(v==null) delete db.stockDia[k][id]; else db.stockDia[k][id]=v; guardar(); subir('stockDia/'+k+'/'+id, v); cerrarModal(); render(); };
  $('#sOk').onclick=()=>set(n);
  $('#sSin').onclick=()=>set(null);
}

// ---------- Sesión ----------
function renderSesion(){
  const u=db.usuario;
  $('#btnSesion').innerHTML = u ? `<span class="avatar">${esc(u.nombre[0].toUpperCase())}</span>${esc(u.nombre.split(' ')[0])}` : 'Iniciar sesión';
  $('#cajonSaludo').textContent = u ? `Hola, ${u.nombre.split(' ')[0]} 👋` : 'Rotisería Yala';
}
function abrirSesion(){
  const u=db.usuario;
  $('#hoja').innerHTML = u ? `
    <h3>Hola, ${esc(u.nombre)}</h3>
    <p style="color:var(--gris);font-size:14px;margin-top:0">${u.pin?'La app pide tu PIN cada vez que se abre.':'La app no tiene PIN.'}</p>
    <div class="acciones"><button class="btn sec" id="sBloq">🔒 Bloquear ahora</button><button class="btn peligro" id="sSalir">Cerrar sesión</button></div>
    <div class="acciones"><button class="btn sec" data-cerrar>Volver</button></div>` : `
    <h3>Iniciar sesión</h3>
    <div class="campo"><label>Tu nombre</label><input id="uNom" maxlength="24" placeholder="Ej: Don Carlos"></div>
    <div class="campo"><label>PIN de 4 números (opcional)</label><input id="uPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      <div class="nota">Así nadie más puede ver tus ventas si agarra el celular.</div></div>
    <div class="acciones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn prim" id="uOk">Entrar</button></div>`;
  abrirModal();
  if(u){
    $('#sSalir').onclick=()=>{ if(confirm('¿Cerrar sesión? Los platos y ventas no se borran.')){ db.usuario=null; guardar(); cerrarModal(); render(); } };
    $('#sBloq').onclick=()=>{ cerrarModal(); if(u.pin) bloquear(); else alert('Primero cerrá sesión y volvé a entrar poniendo un PIN.'); };
  } else {
    $('#uOk').onclick=()=>{
      const nombre=$('#uNom').value.trim(), pin=$('#uPin').value.trim();
      if(!nombre){ $('#uNom').focus(); return; }
      if(pin && !/^\d{4,6}$/.test(pin)){ alert('El PIN tiene que ser de 4 a 6 números.'); return; }
      db.usuario={nombre, pin:pin||null}; guardar(); cerrarModal(); render();
    };
  }
}
function bloquear(){
  $('#candado').classList.add('on'); $('#pinIn').value=''; $('#pinErr').textContent='';
  setTimeout(()=>$('#pinIn').focus(),100);
}
$('#pinIn').addEventListener('input',e=>{
  const v=e.target.value;
  if(v.length>=db.usuario.pin.length){
    if(v===db.usuario.pin){ $('#candado').classList.remove('on'); }
    else { $('#pinErr').textContent='PIN incorrecto'; e.target.value=''; if(navigator.vibrate) navigator.vibrate(150); }
  }
});

// ---------- Resumen por WhatsApp ----------
function resumenTexto(){
  const vs=ventasDesde(inicioDia()), r=sumar(vs), pp=porPlato(vs), so=soldoutHoy();
  const lineas=Object.entries(pp).sort((a,b)=>b[1].cant-a[1].cant).map(([id,d])=>`• ${nombrePlato(id)}: ${d.cant} (${plata(d.plata)})`);
  return `*Rotisería Yala · Resumen del ${new Date().toLocaleDateString('es-AR')}*\n\n`+
    `🍽️ Platos vendidos: ${r.cant}\n💰 Caja: ${plata(r.plata)}\n`+
    (db.platos.some(p=>p.costo>0)?`📈 Ganancia: ${plata(r.ganancia)}\n`:'')+
    (so?`⏰ Sold out: ${hora(so.t)}\n`:'')+
    (lineas.length?`\n${lineas.join('\n')}`:'')+`\n\n_Hecho con RotiApp_`;
}

// ---------- Copia de seguridad ----------
function exportar(){
  const {usuario, ...datos} = db;
  const blob=new Blob([JSON.stringify(datos)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`rotiapp-copia-${claveDia()}.json`; a.click();
}
function importar(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.platos||!d.ventas) throw 0;
      if(!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Seguro?')) return;
      db={stockDia:{},soldouts:[],...d,usuario:db.usuario}; guardar(); if(nube) nube.set(paraNube(db)).catch(errorNube); cerrarMenu(); render();
    }catch(e){ alert('Ese archivo no es una copia de RotiApp.'); }
  };
  r.readAsText(file);
}

// ---------- Modal, menú y aviso ----------
function abrirModal(){ $('#modal').classList.add('on'); }
function cerrarModal(){ $('#modal').classList.remove('on'); }
function abrirMenu(){ renderMenu(); $('#cajon').classList.add('on'); $('#velo').classList.add('on'); }
function cerrarMenu(){ $('#cajon').classList.remove('on'); $('#velo').classList.remove('on'); }
let toastT, toastFn;
function avisar(txt, deshacer){
  $('#toastTxt').textContent=txt; toastFn=deshacer;
  $('#toastBtn').style.display = deshacer?'':'none';
  $('#toast').classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(()=>$('#toast').classList.remove('on'),3000);
}

// ---------- Eventos ----------
$('#abrirMenu').onclick=abrirMenu;
$('#cerrarMenu').onclick=cerrarMenu;
$('#velo').onclick=cerrarMenu;
$('#fab').onclick=()=>abrirPlato(null);
$('#btnSesion').onclick=abrirSesion;
$('#btnCierre').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(resumenTexto()),'_blank');
$('#btnExportar').onclick=exportar;
$('#btnImportar').onclick=()=>$('#archivoImport').click();
$('#archivoImport').onchange=e=>e.target.files[0]&&importar(e.target.files[0]);
$('#toastBtn').onclick=()=>{ if(toastFn){toastFn(); toastFn=null;} $('#toast').classList.remove('on'); };
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal' || e.target.closest('[data-cerrar]')) cerrarModal();
  const em=e.target.closest('[data-emoji]');
  if(em){ emojiTemp=em.dataset.emoji; document.querySelectorAll('.emojis button').forEach(b=>b.classList.toggle('on',b===em)); }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-restar],[data-vender],[data-editar],[data-ir],[data-periodo],[data-stock],#btnSoldout,#deshacerSO');
  if(!t) return;
  if(t.dataset.restar) restar(t.dataset.restar);
  else if(t.dataset.vender) vender(t.dataset.vender);
  else if(t.dataset.editar) abrirPlato(t.dataset.editar);
  else if(t.dataset.ir) irA(t.dataset.ir);
  else if(t.dataset.periodo){ periodoIngresos=t.dataset.periodo; render(); }
  else if(t.dataset.stock) abrirStock(t.dataset.stock);
  else if(t.id==='btnSoldout') marcarSoldout();
  else if(t.id==='deshacerSO'){ if(confirm('¿Borrar la hora de sold out de hoy?')){ db.soldouts=db.soldouts.filter(s=>s.dia!==claveDia()); guardar(); borrarNube('soldouts/'+claveDia()); render(); } }
});
// si queda abierta pasada la medianoche, refresca sola
setInterval(()=>{ if(!$('#modal').classList.contains('on')) render(); }, 60000);

render();
conectarNube();
if(db.usuario?.pin) bloquear();
</script>
</body>
</html>
